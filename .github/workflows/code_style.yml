name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  unit-tests:
    name: PHP ${{ matrix.php }} tests on symfony ${{ matrix.symfony_version }}, deps=${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']
        symfony_version: ['6.4.*', '7.3.*', '7.4.*', '8.0.*']
        dependencies: ['lowest', 'highest']

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: phpunit

      - run: php ./tests/bin/pin-symfony-version.php "${{ matrix.symfony_version }}"

      - uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: PHPUnit
        run: phpunit

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, phpcs

      - uses: "ramsey/composer-install@v3"

      - name: PHPCS
        run: phpcs -p

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, phpstan

      - uses: "ramsey/composer-install@v3"

      - name: PHPStan
        run: phpstan analyse src --error-format=checkstyle | cs2pr
